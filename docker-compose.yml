# Base Python independiente de los volúmenes del prototipo Nest.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: turnos_dev
      POSTGRES_DB: miturno_python
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata_python:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d miturno_python"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata_python:
