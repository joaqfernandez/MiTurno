# Verificación automática. Documentación y estado: docs/CI.md
name: CI

# Una sola ejecución por evento, con los tres jobs: en cada PR hacia main y al mezclar.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turnos
          POSTGRES_PASSWORD: turnos_dev
          POSTGRES_DB: miturno_python
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U turnos -d miturno_python"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apps/api-python/requirements.txt
      - run: npm run setup:api
      - run: npm run test:api:pg

  web:
    name: Web (tests, tipos y build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:web
      # next-env.d.ts no se versiona (Next 16 lo reescribe en cada ejecución); se genera antes de revisar tipos.
      - run: npx next typegen
        working-directory: apps/web
      - run: npx tsc --noEmit --incremental false -p tsconfig.json
        working-directory: apps/web
      - run: npm run build:web

  e2e:
    name: Navegador (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apps/api-python/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm run setup:api
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-trazas
          path: apps/web/test-results/
          retention-days: 7
